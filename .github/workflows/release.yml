name: "Release"

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Target version tag (e.g., v0.1.0-beta). If left empty, it will auto-detect from package.json"
        required: false
        default: ""

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev build-essential cmake curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            PKG_VER=$(node -p "require('./package.json').version")
            echo "RELEASE_VERSION=v${PKG_VER}" >> $GITHUB_ENV
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_VERSION }}
          releaseName: "PumAgent Release ${{ env.RELEASE_VERSION }}"
          releaseBody: "Automated release for PumAgent ${{ env.RELEASE_VERSION }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
