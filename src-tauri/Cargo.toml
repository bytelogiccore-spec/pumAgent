[package]
name = "pumagent"
version = "0.1.0-beta"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "pumagent"

[[bin]]
name = "pumagent"
path = "src/main.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
rquest = { version = "5.1.0", features = ["json"] }
rquest-util = "2.2.1"
tokio = { version = "1", features = ["full"] }
scraper = "0.26.0"
html2md = "0.2.15"
chrono = "0.4.44"
futures = "0.3.32"
urlencoding = "2.1.3"
rand = "0.8.5"
teloxide = { version = "0.13.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
cron = "0.16.0"
dbx-core = "0.2.2"
regex = "1.12.3"
base64 = "0.22.1"
flate2 = "1.1.9"
rhai = "1.24.0"
keyring = "3.6.3"
